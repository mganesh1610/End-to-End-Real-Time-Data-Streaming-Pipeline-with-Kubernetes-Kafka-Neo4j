[extend]
useDefault = true

[[rules]]
id = "neo4j-plaintext-password"
description = "Neo4j password set directly in tracked deployment configuration"
regex = '''(?i)(?:password\s*:|"neo4j\.authentication\.basic\.password"\s*:)\s*["']?([A-Za-z0-9_!@#$%^&*+=./-]{8,})'''
secretGroup = 1
keywords = ["password"]
