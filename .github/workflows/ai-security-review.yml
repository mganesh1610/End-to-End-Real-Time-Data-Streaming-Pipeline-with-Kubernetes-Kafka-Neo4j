name: AI security review

on:
  workflow_run:
    workflows: [Security review]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-security-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run uses the trusted default-branch commit. Never check out the PR head.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Review PR diff with OpenAI when configured
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_SECURITY_REVIEW_MODEL || 'gpt-6.1-sol' }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .github/scripts/ai_security_review.py
